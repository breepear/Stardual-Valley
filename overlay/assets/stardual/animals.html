<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Animals</title>
<style>
  :root {
    --row: #f9da95;
    --rule: #d6aa67;
    --ink: #2f1c11;
    --sub: #6b4d2e;
    --good: #3f6b1d;
    --good-bg: #cfe39a;
    --good-rule: #7fa443;
    --warn: #a63a17;
    --chip: #e59436;
    --track: #e6b466;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: transparent; color: var(--ink); font-family: sans-serif; user-select: none; }
  /* Pinned to the window: the page loads before the WebView has a size. */
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; overflow: hidden; }
  img { image-rendering: pixelated; }

  .strip { display: flex; gap: 4px; padding: 0 0 4px; flex: none; }
  .stat { flex: 1; background: var(--row); border: 1px solid var(--rule); padding: 4px 8px; min-width: 0; }
  .stat .label { font-size: 10px; color: var(--sub); }
  .stat .value { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.done { background: var(--good-bg); border-color: var(--good-rule); }
  .stat.done .value { color: var(--good); }
  .stat.todo .value { color: var(--warn); }

  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .scroll::-webkit-scrollbar { width: 5px; }
  .scroll::-webkit-scrollbar-track { background: var(--track); }
  .scroll::-webkit-scrollbar-thumb { background: #b06a2a; }

  .section { font-size: 13px; font-weight: bold; padding: 6px 2px 4px; display: flex; justify-content: space-between; align-items: baseline; }
  .section .count { font-size: 10.5px; color: var(--sub); font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px; }
  .list { background: var(--row); border: 1px solid var(--rule); }

  .mon { background: var(--row); border: 1px solid var(--rule); padding: 6px 8px; display: flex; gap: 8px; align-items: center; }
  .mon.trained { background: var(--good-bg); border-color: var(--good-rule); }
  .pic { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; }
  .pic img { max-width: 40px; max-height: 40px; }
  .text { flex: 1; min-width: 0; }
  .title { font-size: 13px; font-weight: bold; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { font-size: 10.5px; color: var(--sub); line-height: 1.3; margin-top: 1px; }
  .detail.warn { color: var(--warn); font-weight: bold; }
  .detail.good { color: var(--good); font-weight: bold; }
  .hearts { color: #c0392b; font-size: 10px; letter-spacing: 1px; }
  .hearts .off { color: #b9a07a; }

  .row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--rule); min-height: 44px; }
  .row:last-child { border-bottom: none; }
  .row .pic { width: 32px; height: 32px; }
  .row .pic img { max-width: 32px; max-height: 32px; }
  .row.owned { background: var(--good-bg); }
  .row.locked .pic img { filter: brightness(0) opacity(.35); }
  .pill { flex: none; font-size: 10px; font-weight: bold; padding: 2px 6px; border: 1px solid; white-space: nowrap; }
  .pill.have { background: #6a9a2a; color: #fff8e0; border-color: #3f6b1d; }
  .pill.house { background: var(--row); color: var(--sub); border-color: var(--rule); }

  .empty { padding: 14px 12px; font-size: 12px; color: var(--sub); line-height: 1.45; background: var(--row); border: 1px solid var(--rule); }
  .empty b { color: var(--ink); }
  .tabs { display: flex; gap: 4px; margin: 2px 0 4px; }
  .tab { font-size: 11.5px; font-weight: bold; padding: 4px 10px; border: 1px solid var(--rule); color: var(--sub); }
  .tab.on { background: var(--chip); border-color: #b06a2a; color: var(--ink); }
  .mood { font-size: 10px; color: var(--sub); }
</style>
</head>
<body>
  <div class="strip" id="strip"></div>
  <div class="scroll" id="scroll"><div class="empty">Load a save to see your animals.</div></div>
<script>
  var state = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pic(data, cls) {
    var box = el('div', cls || 'pic');
    if (data) { var i = new Image(); i.src = 'data:image/png;base64,' + data; box.appendChild(i); }
    return box;
  }
  function stat(label, value, cls) {
    var s = el('div', 'stat' + (cls ? ' ' + cls : ''));
    s.appendChild(el('div', 'label', label));
    s.appendChild(el('div', 'value', value));
    return s;
  }
  function hearts(n) {
    var h = el('span', 'hearts');
    for (var i = 0; i < 5; i++) h.appendChild(el('span', i < n ? '' : 'off', '\u2665'));
    return h;
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function mood(h) {
    h = Number(h) || 0;
    return h >= 200 ? 'Very happy' : h >= 150 ? 'Happy' : h >= 90 ? 'Fine' : 'Unhappy';
  }

  function drawStrip() {
    var strip = document.getElementById('strip');
    strip.innerHTML = '';
    var list = state.animals || [];
    var left = list.filter(function (a) { return a.petted !== '1'; }).length;
    var collect = list.filter(function (a) { return a.collect; }).length;
    if (list.length) strip.appendChild(stat('Petting', left ? left + ' to pet' : 'All petted', left ? 'todo' : 'done'));
    if (list.length) strip.appendChild(stat('To collect', collect ? collect + ' ready' : 'Nothing yet', collect ? 'todo' : ''));
    var eaters = Number(state.eaters) || 0, hay = Number(state.hay) || 0, cap = Number(state.hayCapacity) || 0;
    if (cap > 0 || hay > 0) {
      var days = eaters ? Math.floor(hay / eaters) : 0;
      strip.appendChild(stat('Hay', eaters ? plural(days, 'day', 'days') + ' left' : hay + ' pieces', eaters && days <= 3 ? 'todo' : ''));
    }
    if (state.pet) {
      var p = state.pet, need = [];
      if (p.petted !== '1') need.push('Pet');
      if (p.bowl !== '1') need.push('fill bowl');
      strip.appendChild(stat(p.name || 'Your pet', need.length ? need.join(', ') : 'All set', need.length ? 'todo' : 'done'));
    }
  }

  function drawAnimals(scroll) {
    var list = state.animals || [];
    var head = el('div', 'section');
    head.appendChild(el('span', '', 'Your animals'));
    if (list.length) head.appendChild(el('span', 'count', plural(list.length, 'animal', 'animals')));
    scroll.appendChild(head);
    if (!list.length) {
      scroll.appendChild(el('div', 'empty', 'No farm animals yet. Build a coop or barn at Robin\'s, then buy animals at Marnie\'s Ranch.'));
      return;
    }
    // Not yet petted first, then those with something to collect.
    list = list.slice().sort(function (a, b) {
      return (a.petted === '1') - (b.petted === '1') || (!a.collect) - (!b.collect);
    });
    var grid = el('div', 'grid');
    list.forEach(function (a) {
      var card = el('div', 'mon' + (a.petted === '1' && !a.collect ? ' trained' : ''));
      card.appendChild(pic(a.icon));
      var t = el('div', 'text');
      t.appendChild(el('div', 'title', a.name));
      var line = el('div', 'detail');
      line.appendChild(document.createTextNode(a.species + (a.baby === '1' ? ' (baby) · ' : ' · ')));
      line.appendChild(hearts(Number(a.hearts) || 0));
      t.appendChild(line);
      t.appendChild(el('div', 'detail ' + (a.petted === '1' ? 'good' : 'warn'), a.petted === '1' ? 'Petted today · ' + mood(a.happiness) : 'Needs petting'));
      t.appendChild(el('div', 'detail' + (a.collect ? ' warn' : ''), a.collect ? a.collect : a.home));
      card.appendChild(t);
      grid.appendChild(card);
    });
    scroll.appendChild(grid);
  }

  function drawHouses(scroll) {
    var houses = state.houses || [];
    if (!houses.length) return;
    scroll.appendChild(el('div', 'section', 'Coops and barns'));
    var list = el('div', 'list');
    houses.forEach(function (h) {
      var r = el('div', 'row');
      var t = el('div', 'text');
      t.appendChild(el('div', 'title', h.name));
      var days = Number(h.buildingDays) || 0;
      if (days > 0) t.appendChild(el('div', 'detail warn', 'Robin is working on it · ready in ' + plural(days, 'day', 'days')));
      else t.appendChild(el('div', 'detail', h.animals + ' of ' + h.capacity + ' spots taken'));
      r.appendChild(t);
      list.appendChild(r);
    });
    scroll.appendChild(list);
  }

  function drawPet(scroll) {
    var p = state.pet;
    if (!p) return;
    scroll.appendChild(el('div', 'section', 'Your pet'));
    var card = el('div', 'mon' + (p.petted === '1' && p.bowl === '1' ? ' trained' : ''));
    card.appendChild(pic(p.icon));
    var t = el('div', 'text');
    t.appendChild(el('div', 'title', p.name));
    t.appendChild(el('div', 'detail ' + (p.petted === '1' ? 'good' : 'warn'), p.petted === '1' ? 'Petted today' : 'Needs petting'));
    t.appendChild(el('div', 'detail ' + (p.bowl === '1' ? 'good' : 'warn'), p.bowl === '1' ? 'Water bowl full' : 'Water bowl is empty'));
    card.appendChild(t);
    scroll.appendChild(card);
  }

  function draw() {
    var scroll = document.getElementById('scroll');
    var top = scroll.scrollTop;
    scroll.innerHTML = '';
    if (!state) { scroll.appendChild(el('div', 'empty', 'Load a save to see your animals.')); return; }
    drawStrip();
    drawAnimals(scroll);
    drawHouses(scroll);
    drawPet(scroll);
    scroll.scrollTop = top;
  }

  window.stardualRender = function (raw) {
    try {
      state = typeof raw === 'string' ? JSON.parse(raw) : raw;
      draw();
    } catch (e) { console.log('animals: ' + e); }
  };
</script>
</body>
</html>
